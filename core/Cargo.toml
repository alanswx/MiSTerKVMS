[package]
name = "kvms-core"
description = "Platform-independent core for MiSTerKVMS: mrext input, sessions, video and audio from capture server streams and local capture cards."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kvms_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = "0.32"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
wgpu = "30"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mkvm = { path = "../mkvm" }
kvms-codec = { path = "../codec" }
kvms-capture = { path = "../capture" }
mdns-sd = "0.13"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
