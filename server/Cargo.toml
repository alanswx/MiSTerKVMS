[package]
name = "misterkvms-capture"
description = "misterkvms-capture: owns the capture cards and streams each MiSTer to any number of viewers (mkvm protocol)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "misterkvms-capture"
path = "src/main.rs"

[dependencies]
mkvm = { path = "../mkvm" }
kvms-capture = { path = "../capture" }
kvms-codec = { path = "../codec" }
kvms-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.13"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
if-addrs = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
