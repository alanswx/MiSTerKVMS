[package]
name = "kvms-capture"
description = "Capture cards (video + audio) for misterkvms-capture and the apps' local capture."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kvms_capture"

[dependencies]
cpal = "0.18"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_System_Ole",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSValue", "NSObject"] }
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureVideoDataOutput",
    "AVCaptureSession",
    "AVMediaFormat",
    "AVCaptureSessionPreset",
    "objc2-core-media",
    "objc2-core-video",
    "dispatch2",
    "block2",
] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMTime", "CMSync", "CMTimeRange", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVPixelFormatDescription"] }
dispatch2 = "0.3"
block2 = "0.6"
