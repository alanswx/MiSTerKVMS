[package]
name = "kvms-cli"
description = "kvms: drive a MiSTer from the command line (screenshots, recording, input, cores)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kvms"
path = "src/main.rs"

[dependencies]
kvms-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
ureq = { version = "3", features = ["json"] }
