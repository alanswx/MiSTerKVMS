[package]
name = "kvms-cli"
description = "misterkvms-cli: drive a MiSTer from the command line (screenshots, recording, input, cores)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "misterkvms-cli"
path = "src/main.rs"

# The old name, kept for one release.
[[bin]]
name = "kvms"
path = "src/kvms_alias.rs"

[dependencies]
kvms-core = { path = "../core" }
kvms-codec = { path = "../codec" }
kvms-capture = { path = "../capture" }
mkvm = { path = "../mkvm" }
memory-stats = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
ureq = { version = "3", features = ["json"] }
