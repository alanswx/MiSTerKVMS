name: Build & Release

# Every push to main publishes a release. The version is MAJOR.MINOR from
# Cargo.toml plus an auto-incremented patch (0.9.0, 0.9.1, ...). Bump the
# version in Cargo.toml to start a new series (e.g. 0.10.0, 1.0.0).
# Pull requests only build and test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Works out the version, so the three platforms can build in parallel.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -1)
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$((last + 1)); fi
          echo "version=$base.$patch" >> "$GITHUB_OUTPUT"
          echo "Version $base.$patch"

  build-mac:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MISTERKVMS_VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      # Notarizing needs the key, its ID and the issuer ID.
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rust toolchain (both Mac architectures)
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p kvms-core

      - name: Import Developer ID certificate
        id: cert
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          kc_pass=$(openssl rand -base64 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Check notarization credentials
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Report the shape of each value (never the values) and test the login
          # before spending time on the build.
          key="$RUNNER_TEMP/check.p8"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"; echo ".p8: pasted as text"
          else
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$key" 2>/dev/null; echo ".p8: base64"
          fi
          grep -q "BEGIN PRIVATE KEY" "$key" && echo ".p8: looks like a private key ($(wc -l < "$key") lines)" || echo "::warning::.p8 secret doesn't decode to a private key"
          kid=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')
          [ "$kid" = "$NOTARY_KEY_ID" ] || echo "::warning::APPLE_API_KEY_ID contains spaces or newlines"
          echo "Key ID length: ${#kid} (expected 10)"
          iss=$(printf '%s' "$NOTARY_ISSUER_ID" | tr -d '[:space:]')
          [ "$iss" = "$NOTARY_ISSUER_ID" ] || echo "::warning::APPLE_API_ISSUER_ID contains spaces or newlines"
          echo "$iss" | grep -Eq '^[0-9a-fA-F-]{36}$' && echo "Issuer ID: looks like a UUID" || echo "::warning::APPLE_API_ISSUER_ID doesn't look like a UUID"
          if ! xcrun notarytool history --key "$key" --key-id "$kid" --issuer "$iss" > /dev/null; then
            rm -f "$key"
            echo "::error::Apple rejected the App Store Connect API key: check that APPLE_API_KEY_ID matches the .p8 (AuthKey_<KEYID>.p8) and that it's a Team key from the team whose Issuer ID you used."
            exit 1
          fi
          rm -f "$key"
          echo "Notarization credentials accepted."

      - name: Build universal app
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity || '-' }}
        run: scripts/build-mac.sh

      - name: Package DMG
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY_ID=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')
          export NOTARY_ISSUER_ID=$(printf '%s' "$NOTARY_ISSUER_ID" | tr -d '[:space:]')
          if [ "$HAS_NOTARY" = "true" ] && [ "$HAS_CERT" = "true" ]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
            # Accept the .p8 pasted as-is or base64-encoded.
            if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$NOTARY_KEY_PATH"
            else
              echo "$APPLE_API_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
            fi
          fi
          scripts/package-dmg.sh "build/MiSTerKVMS-${{ env.VERSION }}.dmg"
          rm -f "$RUNNER_TEMP/notary.p8"

      # The DMG itself (not zipped); the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: build/MiSTerKVMS-${{ env.VERSION }}.dmg
          archive: false

      - name: Clean up keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MISTERKVMS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test core
        run: cargo test -p kvms-core

      - name: Build and package
        shell: pwsh
        run: scripts/build-windows.ps1 -Package -Version $env:VERSION

      # Wrapped in a normal artifact: download-artifact unzips an unwrapped
      # .zip, which would spill the app's files into the release.
      - uses: actions/upload-artifact@v7
        with:
          name: MiSTerKVMS-${{ env.VERSION }}-win-x64
          path: build/MiSTerKVMS-${{ env.VERSION }}-win-x64.zip

      # The capture server on its own, for the setup page's Update button.
      - uses: actions/upload-artifact@v7
        with:
          path: build/misterkvms-capture-${{ env.VERSION }}-win-x64.exe
          archive: false

  build-linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MISTERKVMS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test core
        run: cargo test -p kvms-core

      - name: Build and package
        run: scripts/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          path: build/MiSTerKVMS-${{ env.VERSION }}-linux-x86_64.tar.gz
          archive: false

  # The iPhone app. Pushes to main (and manual runs on main) archive it and
  # upload it to TestFlight when the App Store Connect key and the team id
  # are set; everything else only checks that it builds (for the simulator).
  # It goes to TestFlight, not into the GitHub release, so it isn't part of
  # publish and an iOS problem never holds up the desktop release.
  build-ios:
    needs: version
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      UPLOAD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # App Store uploads must be built with a recent SDK: use the newest
      # released Xcode on the runner.
      - name: Select Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Rust toolchain (iOS)
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim --target aarch64-apple-darwin
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (simulator)
        if: env.UPLOAD != 'true'
        run: scripts/build-ios.sh

      - name: Build and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          DEVELOPMENT_TEAM=$(printf '%s' "$DEVELOPMENT_TEAM" | tr -d '[:space:]')
          export ASC_KEY_ID ASC_ISSUER_ID DEVELOPMENT_TEAM
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Accept the .p8 pasted as-is or base64-encoded (as build-mac does).
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$ASC_KEY_PATH"
          else
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          fi
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          scripts/build-ios.sh --testflight

      - name: xcodebuild logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcodebuild-logs
          path: build/ios/xcodebuild-*.log
          if-no-files-found: ignore

  # Every platform built: publish them together.
  publish:
    needs: [version, build-mac, build-windows, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MISTERKVMS_VERSION: ${{ needs.version.outputs.version }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          if [ "$HAS_CERT" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            signing="Signed with Developer ID and notarized by Apple."
          elif [ "$HAS_CERT" = "true" ]; then
            signing="Signed with Developer ID but **not notarized**: macOS will warn the first time; right-click the app → Open."
          else
            signing="**Not notarized:** after copying to Applications, right-click the app → Open the first time (or run \`xattr -dr com.apple.quarantine /Applications/MiSTerKVMS.app\`)."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **macOS:** universal app (Apple Silicon + Intel), macOS 14 or later. Open the DMG and drag **MiSTerKVMS** to **Applications**.

          $signing

          **Windows:** 64-bit Windows 10 or 11. Unzip \`MiSTerKVMS-$VERSION-win-x64.zip\` anywhere and run **MiSTerKVMS.exe**. Not code-signed yet: SmartScreen may warn the first time (More info → Run anyway). Recording needs [ffmpeg](https://ffmpeg.org) (\`winget install ffmpeg\`).

          **MiSTerKVMS Capture** (the PC with the capture cards): run \`misterkvms-capture.exe\` from the Windows zip (on the Mac: \`/Applications/MiSTerKVMS.app/Contents/MacOS/misterkvms-capture\`); its setup page opens at http://localhost:5971. Add a stream for each card there. On Windows, **Run in the background** installs it as a service that starts with the PC, and **Check for updates** updates it from these releases (\`misterkvms-capture-$VERSION-win-x64.exe\`). In the app, add a host and pick the stream, or a capture card plugged into that computer (Windows and Mac).

          **Linux:** x86_64, GNOME/KDE on Wayland (X11 works too); needs GTK 4.14+ and libadwaita 1.5+ (Ubuntu 24.04, Fedora 40 or newer). Unpack \`MiSTerKVMS-$VERSION-linux-x86_64.tar.gz\` and run \`./install.sh\` (or \`./misterkvms\` in place). Watches MiSTerKVMS Capture streams; recording needs ffmpeg.

          Requirements: [mrext Remote](https://github.com/wizzomafizzo/mrext) on the MiSTer. NDI, OBS and DistroAV are no longer used: hosts that used them switch to the capture stream showing the same MiSTer.
          EOF
          # The release files themselves; a folder means an artifact got unpacked.
          if [ -n "$(find dist -mindepth 1 -type d)" ]; then
            echo "dist/ has folders (an artifact was unpacked):"; find dist | head -40; exit 1
          fi
          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)
          printf 'Publishing %s\n' "${files[@]}"
          gh release create "v$VERSION" "${files[@]}" \
            --target "$GITHUB_SHA" --title "MiSTerKVMS $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

